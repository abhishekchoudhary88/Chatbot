<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abhishek AI Vision Studio Pro</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
/* ===== CSS VARIABLES (THEMING) ===== */
:root {
    --bg: #0f172a;
    --sidebar: rgba(17, 24, 39, 0.7);
    --text: #ffffff;
    --accent: #10a37f;
    --accent-hover: #0d8a6b;
    --border: rgba(255, 255, 255, 0.1);
    --bot: rgba(30, 41, 59, 0.7);
    --user: linear-gradient(135deg, #0ea5e9, #2563eb);
    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

.light {
    --bg: #f8fafc;
    --sidebar: rgba(255, 255, 255, 0.8);
    --text: #0f172a;
    --border: rgba(0, 0, 0, 0.1);
    --bot: rgba(226, 232, 240, 0.8);
    --user: linear-gradient(135deg, #0ea5e9, #2563eb);
    --glass-bg: rgba(255, 255, 255, 0.6);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

/* ===== GLOBAL STYLES ===== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at top left, #1e3a8a 0%, transparent 50%),
                radial-gradient(circle at bottom right, #7c3aed 0%, transparent 50%),
                var(--bg);
    transition: background 0.5s ease, color 0.5s ease;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00f5ff, #7c3aed); border-radius: 10px; }

/* ===== SIDEBAR ===== */
.sidebar {
    width: 280px;
    background: var(--sidebar);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    padding: 25px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    position: relative;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.4s;
    box-shadow: var(--glass-shadow);
    z-index: 10;
}

.sidebar.closed { width: 70px; padding: 25px 10px; }
.sidebar.closed button span { display: none; }

.sidebar button {
    background: var(--glass-bg);
    border: 1px solid var(--border);
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    white-space: nowrap;
}

.sidebar button:hover {
    background: linear-gradient(135deg, #06b6d4, #7c3aed);
    transform: translateY(-2px);
    color: white;
    box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
    border-color: transparent;
}

.toggle-btn {
    position: absolute;
    top: 20px;
    right: -18px;
    background: linear-gradient(135deg, #06b6d4, #7c3aed);
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    z-index: 20;
    transition: transform 0.3s;
}
.toggle-btn:hover { transform: scale(1.1); }

/* ===== MAIN AREA ===== */
.main { flex: 1; display: flex; flex-direction: column; position: relative; transition: 0.4s ease; }

.theme-toggle {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 24px;
    cursor: pointer;
    transition: 0.3s;
    z-index: 100;
    background: var(--glass-bg);
    padding: 10px;
    border-radius: 50%;
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
}
.theme-toggle:hover { transform: rotate(30deg) scale(1.1); }

/* ===== WELCOME SCREEN (BIG TITLE) ===== */
.welcome-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.welcome-container.shrink {
    flex: unset;
    padding: 15px 30px;
    flex-direction: row;
    justify-content: flex-start;
    border-bottom: 1px solid var(--border);
    background: var(--glass-bg);
    backdrop-filter: blur(15px);
}

.logo-circle {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00f5ff, #7c3aed);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 28px;
    color: white;
    box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
    transition: all 0.6s ease;
    margin-bottom: 20px;
}

.welcome-container.shrink .logo-circle { width: 45px; height: 45px; font-size: 16px; margin-bottom: 0; margin-right: 15px; }

.title-text h1 {
    font-size: 48px;
    background: linear-gradient(90deg, #00f5ff, #7c3aed, #00f5ff);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 6s linear infinite;
    transition: all 0.6s ease;
}

.title-text span { font-size: 18px; color: #94a3b8; letter-spacing: 2px; text-transform: uppercase; transition: all 0.6s ease; }
.welcome-container.shrink .title-text h1 { font-size: 24px; }
.welcome-container.shrink .title-text span { font-size: 12px; }

@keyframes shine { 0% { background-position: 0%; } 100% { background-position: 200%; } }

/* ===== CHAT AREA ===== */
.chat-area { flex: 1; padding: 30px 10%; overflow-y: auto; display: none; scroll-behavior: smooth; }

.message { display: flex; margin-bottom: 25px; animation: fadeIn 0.4s ease forwards; opacity: 0; transform: translateY(15px); }
.user { justify-content: flex-end; }
.bot { justify-content: flex-start; }

@keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

.bubble {
    padding: 16px 22px;
    border-radius: 20px;
    max-width: 75%;
    line-height: 1.6;
    font-size: 15px;
    box-shadow: var(--glass-shadow);
    position: relative;
}

.user .bubble { background: var(--user); color: white; border-bottom-right-radius: 4px; }
.bot .bubble { background: var(--bot); backdrop-filter: blur(20px); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

.copy-btn {
    position: absolute; bottom: -25px; right: 0; font-size: 14px; cursor: pointer; opacity: 0.6; transition: 0.3s;
}
.copy-btn:hover { opacity: 1; }

/* ===== INPUT AREA ===== */
.input-area { display: none; padding: 20px 10%; background: transparent; position: relative; }

.input-wrapper {
    display: flex; width: 100%; background: var(--glass-bg); backdrop-filter: blur(20px);
    border: 1px solid var(--border); border-radius: 30px; padding: 8px; box-shadow: var(--glass-shadow);
}

.mic-btn {
    width: 45px; height: 45px; border-radius: 50%; border: none; background: transparent;
    color: var(--text); font-size: 18px; cursor: pointer; transition: 0.3s; margin-right: 5px;
}
.mic-btn:hover { background: rgba(255,255,255,0.1); }
.mic-btn.recording { color: #ef4444; animation: pulse 1.5s infinite; }

@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

input { flex: 1; background: transparent; border: none; color: var(--text); padding: 10px 15px; font-size: 16px; outline: none; }
input::placeholder { color: #64748b; }

.send-btn {
    width: 45px; height: 45px; border-radius: 50%; border: none; background: linear-gradient(135deg, #00f5ff, #7c3aed);
    color: white; font-size: 18px; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
    display: flex; align-items: center; justify-content: center;
}
.send-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(124, 58, 237, 0.6); }

/* ===== IMAGE SECTION ===== */
.image-section { flex: 1; padding: 40px 10%; display: none; overflow-y: auto; }

.image-panel {
    background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--border);
    border-radius: 20px; padding: 30px; box-shadow: var(--glass-shadow); text-align: center; max-width: 600px; margin: 0 auto;
    transition: 0.3s; /* For Drag & Drop effect */
}
.image-panel.dragover { background: rgba(6, 182, 212, 0.15); border: 2px dashed #06b6d4; }

.image-panel h2 { margin-bottom: 20px; font-weight: 600; }

select {
    width: 100%; padding: 12px; border-radius: 10px; background: var(--bot); color: var(--text);
    border: 1px solid var(--border); margin-bottom: 20px; font-size: 16px; outline: none;
}

input[type="file"] { width: 100%; padding: 10px; margin-bottom: 20px; background: var(--bot); border-radius: 10px; }

#preview { display: none; max-width: 100%; height: auto; border-radius: 12px; margin-bottom: 20px; border: 2px solid var(--border); }

.image-btn {
    width: 100%; padding: 15px; border: none; border-radius: 12px; background: linear-gradient(135deg, #06b6d4, #7c3aed);
    color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
}
.image-btn:hover { box-shadow: 0 10px 25px rgba(124, 58, 237, 0.4); transform: translateY(-2px); }

#imageResult {
    margin-top: 25px; padding: 20px; background: var(--bot); border-radius: 12px; max-height: 300px;
    overflow-y: auto; text-align: left; border: 1px solid var(--border);
}

/* ===== TOAST NOTIFICATION ===== */
.toast {
    position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #10b981, #059669);
    color: white; padding: 12px 25px; border-radius: 30px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000;
}
.toast.show { bottom: 30px; }

/* ===== LOADERS ===== */
.loader { display: none; text-align: center; margin: 15px 0; font-size: 16px; font-weight: bold; color: var(--accent); }

.typing-indicator span {
    width: 8px; height: 8px; margin: 0 3px; border-radius: 50%; display: inline-block; background: #10a37f; animation: bounce 1s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="toggle-btn" onclick="toggleSidebar()">☰</div>
    <button onclick="showChat()">💬 <span>Chat</span></button>
    <button onclick="showImage()">🖼 <span>Image Analysis</span></button>
    <button onclick="newChat()">➕ <span>New Chat</span></button>
    <button onclick="clearHistory()">🗑 <span>Clear History</span></button>
    
    <div style="flex:1"></div>
    <button onclick="exportChat()" style="background: rgba(255,255,255,0.05); margin-top: auto;">💾 <span>Export Chat</span></button>
</div>

<div class="main">
    <div class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Toggle Theme">🌙</div>

    <div class="welcome-container" id="welcomeScreen">
        <div class="logo-circle">AI</div>
        <div class="title-text">
            <h1>Abhishek AI</h1>
            <span>Vision Studio Pro</span>
        </div>
    </div>

    <div class="chat-area" id="chatArea"></div>
    
    <div class="loader" id="chatLoader">
        <div class="typing-indicator">
            Thinking <span></span><span></span><span></span>
        </div>
    </div>

    <div class="input-area" id="chatInputArea">
        <div class="input-wrapper">
            <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="Voice Typing">🎤</button>
            <input type="text" id="message" placeholder="Type your message here..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div class="image-section" id="imageSection">
        <div class="image-panel" id="imagePanel">
            <h2>🖼 Image Analysis Pro</h2>
            <select id="mode">
                <option value="describe">Describe Details</option>
                <option value="caption">Generate Caption</option>
                <option value="objects">Identify Objects</option>
            </select>
            
            <input type="file" id="imageInput" accept="image/*" title="Drag & Drop or click to select">
            <img id="preview" alt="Image Preview">
            
            <button class="image-btn" onclick="uploadImage()">Analyze Image</button>
            
            <div class="loader" id="imgLoader">
                <div class="typing-indicator">
                    Analyzing <span></span><span></span><span></span>
                </div>
            </div>
            
            <div id="imageResult"></div>
        </div>
    </div>

</div>

<div class="toast" id="toast">Action Complete</div>

<script>
    // --- ELEMENT REFERENCES ---
    const sidebar = document.getElementById("sidebar");
    const welcomeScreen = document.getElementById("welcomeScreen");
    const themeBtn = document.getElementById("themeBtn");
    
    const chatArea = document.getElementById("chatArea");
    const chatInputArea = document.getElementById("chatInputArea");
    const messageInput = document.getElementById("message");
    const chatLoader = document.getElementById("chatLoader");
    const micBtn = document.getElementById("micBtn");
    
    const imageSection = document.getElementById("imageSection");
    const imageInput = document.getElementById("imageInput");
    const imagePanel = document.getElementById("imagePanel");
    const preview = document.getElementById("preview");
    const imageResult = document.getElementById("imageResult");
    const mode = document.getElementById("mode");
    const imgLoader = document.getElementById("imgLoader");
    
    const toastEl = document.getElementById("toast");

    // --- TOAST NOTIFICATION FUNCTION ---
    function showToast(msg, isError = false) {
        toastEl.innerText = msg;
        toastEl.style.background = isError ? "linear-gradient(135deg, #ef4444, #b91c1c)" : "linear-gradient(135deg, #10b981, #059669)";
        toastEl.classList.add("show");
        setTimeout(() => toastEl.classList.remove("show"), 3000);
    }

    // --- UI INTERACTIONS ---
    function toggleSidebar() {
        sidebar.classList.toggle("closed");
    }

    function toggleTheme() {
        document.body.classList.toggle("light");
        themeBtn.innerText = document.body.classList.contains("light") ? "☀" : "🌙";
    }

    function activateApp() {
        welcomeScreen.classList.add("shrink");
    }

    function showChat() {
        activateApp();
        chatArea.style.display = "block";
        chatInputArea.style.display = "block";
        imageSection.style.display = "none";
        setTimeout(() => chatArea.scrollTop = chatArea.scrollHeight, 100);
    }

    function showImage() {
        activateApp();
        chatArea.style.display = "none";
        chatInputArea.style.display = "none";
        imageSection.style.display = "block";
    }

    // --- CHAT LOGIC (Original layout restored) ---
    function addMessage(role, text) {
        let msg = document.createElement("div");
        msg.className = "message " + role;

        let bubble = document.createElement("div");
        bubble.className = "bubble";
        
        try {
            bubble.innerHTML = marked.parse(text);
        } catch(e) {
            bubble.innerText = text;
        }

        if (role === "bot") {
            let copy = document.createElement("span");
            copy.className = "copy-btn";
            copy.innerText = "📋 Copy";
            copy.title = "Copy to clipboard";
            copy.onclick = () => {
                navigator.clipboard.writeText(text);
                copy.innerText = "✔ Copied";
                showToast("Copied to clipboard!");
                setTimeout(() => copy.innerText = "📋 Copy", 2000);
            };
            bubble.appendChild(copy);
        }

        msg.appendChild(bubble);
        chatArea.appendChild(msg);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function sendMessage() {
        let msg = messageInput.value.trim();
        if (!msg) return;

        activateApp();
        addMessage("user", msg);
        messageInput.value = "";
        chatLoader.style.display = "block";

        // Your Original Backend API Call
        fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg })
        })
        .then(res => res.json())
        .then(data => {
            chatLoader.style.display = "none";
            addMessage("bot", data.response);
        })
        .catch(err => {
            chatLoader.style.display = "none";
            addMessage("bot", "❌ Error connecting to server. Please check your backend.");
        });
    }

    messageInput.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            sendMessage();
        }
    });

    // --- VOICE TYPING (New Feature) ---
    let recognition;
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        
        recognition.onresult = function(event) {
            const text = event.results[0][0].transcript;
            messageInput.value += text;
            micBtn.classList.remove("recording");
            showToast("Voice captured");
        };
        recognition.onerror = function() {
            micBtn.classList.remove("recording");
            showToast("Voice input failed", true);
        };
        recognition.onend = function() { micBtn.classList.remove("recording"); }
    }

    function toggleVoice() {
        if (!recognition) return showToast("Voice typing not supported in this browser", true);
        if (micBtn.classList.contains("recording")) {
            recognition.stop();
            micBtn.classList.remove("recording");
        } else {
            recognition.start();
            micBtn.classList.add("recording");
            showToast("Listening...");
        }
    }

    // --- IMAGE LOGIC & DRAG N DROP (Integrated into old design) ---
    function handleImageFile(file) {
        if (!file) {
            preview.style.display = "none";
            return;
        }
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    }

    imageInput.addEventListener("change", function() {
        handleImageFile(this.files[0]);
    });

    // Drag and Drop Events for the Image Panel
    imagePanel.addEventListener("dragover", (e) => {
        e.preventDefault();
        imagePanel.classList.add("dragover");
    });
    imagePanel.addEventListener("dragleave", () => {
        imagePanel.classList.remove("dragover");
    });
    imagePanel.addEventListener("drop", (e) => {
        e.preventDefault();
        imagePanel.classList.remove("dragover");
        if (e.dataTransfer.files.length) {
            imageInput.files = e.dataTransfer.files;
            handleImageFile(e.dataTransfer.files[0]);
            showToast("Image loaded via Drag & Drop");
        }
    });

    function uploadImage() {
        let file = imageInput.files[0];
        if (!file) return alert("Please select an image first.");

        imgLoader.style.display = "block";
        imageResult.innerHTML = "";

        let fd = new FormData();
        fd.append("image", file);
        fd.append("mode", mode.value);

        // Your Original Backend API Call
        fetch("/predict", {
            method: "POST",
            body: fd
        })
        .then(res => res.json())
        .then(data => {
            imgLoader.style.display = "none";
            try {
                imageResult.innerHTML = marked.parse(data.result);
            } catch(e) {
                imageResult.innerText = data.result;
            }
            showToast("Analysis Complete!");
        })
        .catch(err => {
            imgLoader.style.display = "none";
            imageResult.innerHTML = "❌ Image Analysis Failed. Please check backend.";
        });
    }

    // --- UTILITIES ---
    function newChat() {
        chatArea.innerHTML = "";
        showToast("New Session Started");
        if(!imageSection.style.display || imageSection.style.display === 'none'){
             showChat();
        }
    }

    function clearHistory() {
        chatArea.innerHTML = "";
        showToast("Chat History Cleared");
    }

    function exportChat() {
        if (chatArea.children.length === 0) return showToast("No chat to export", true);
        let chatText = "Abhishek AI - Chat Export\n\n";
        document.querySelectorAll(".message").forEach(msg => {
            let role = msg.classList.contains("user") ? "You: " : "AI: ";
            let text = msg.querySelector(".bubble").innerText.replace("📋 Copy", "").replace("✔ Copied", "").trim();
            chatText += role + text + "\n\n";
        });
        
        const blob = new Blob([chatText], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "Abhishek_AI_Chat.txt";
        a.click();
        showToast("Chat Exported Successfully!");
    }
</script>

</body>
</html>
